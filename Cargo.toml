[package]
edition = "2024"
name    = "tinyvm"
version = "0.1.0"

[dependencies]
anyhow             = "1.0"
bitflags           = "2.13"
disarm64           = "0.2"
disarm64_defn      = "0.2"
fn-ptr             = "0.9"
libc               = "0.2"
mach2              = "0.7"
object             = "0.40"
parking_lot        = "0.12"
paste              = "1.0"
smallvec           = "1.16"
soft-canonicalize  = "0.5"
tracing            = "0.1"
tracing-core       = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }

[build-dependencies]
cc = "1.9"
