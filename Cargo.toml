[package]
edition = "2024"
name    = "tinyvm"
version = "0.1.0"

[dependencies]
anyhow             = "1.0"
bitflags           = "2.13"
clap               = { version = "4.6", features = ["derive"] }
fn-ptr             = "0.9"
libc               = "0.2"
object             = "0.39"
parking_lot        = "0.12"
paste              = "1.0"
smallvec           = "1.15"
soft-canonicalize  = "0.5"
tracing            = "0.1"
tracing-core       = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
disarm64      = "0.2"
disarm64_defn = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[build-dependencies]
cc = "1.2"
